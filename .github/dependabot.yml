version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 2
    groups:
      frontend-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
      - dependency-name: 'stylelint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'stylelint-config-standard'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'cssnano'
        update-types: ['version-update:semver-major']
    labels:
      - 'dependencies'
      - 'frontend'

  - package-ecosystem: 'npm'
    directory: '/functions'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 2
    groups:
      functions-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: 'firebase-admin'
        update-types: ['version-update:semver-major']
      - dependency-name: 'firebase-functions'
        update-types: ['version-update:semver-major']
    labels:
      - 'dependencies'
      - 'cloud-functions'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 2
    groups:
      actions-updates:
        patterns:
          - '*'
    labels:
      - 'dependencies'
      - 'ci-cd'
